services:
  db:
    image: postgres:16-alpine
    command: >
      postgres
      -c shared_buffers=64MB
      -c max_connections=20
      -c effective_cache_size=128MB
      -c work_mem=2MB
      -c maintenance_work_mem=32MB
      -c wal_buffers=4MB
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 384m
    restart: unless-stopped

  app:
    image: corp-gifts-app:latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      REGISTRATION_TICKET_SECRET: ${REGISTRATION_TICKET_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      # Demo sign-in is enabled in this demo stack; set DEMO_LOGIN=0 to return
      # to strict Google-only sign-in.
      DEMO_LOGIN: ${DEMO_LOGIN:-1}
    ports:
      - "127.0.0.1:3000:3000"
    mem_limit: 384m
    restart: unless-stopped

volumes:
  db_data:
